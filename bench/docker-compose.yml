name: bench

# Self-contained benchmark stack for comparing four log-transport approaches:
#   A: Kafka + JSON+Snappy (baseline)
#   B: Kafka + Avro+Snappy + Schema Registry
#   C: Sidecar -> MinIO Avro+Snappy objects
#   D: Sidecar -> MinIO Parquet+Zstd objects
#
# Profiles select the per-approach services. Core (kafka, minio) is always on.

x-driver-image: &driver-image
  image: bench/pyrunner:latest
  build:
    context: ./driver
    dockerfile: Dockerfile

services:
  # ---------- Core: always on ----------
  kafka:
    image: apache/kafka:3.9.0
    container_name: bench-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "6"
      CLUSTER_ID: bench-cluster-id-22-chars
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [bench]

  minio:
    image: minio/minio:latest
    container_name: bench-minio
    hostname: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: bench
      MINIO_ROOT_PASSWORD: benchpass
      MINIO_PROMETHEUS_AUTH_TYPE: public
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [bench]

  minio-init:
    image: minio/mc:latest
    container_name: bench-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bench benchpass &&
      mc mb -p local/bench-c-avro || true &&
      mc mb -p local/bench-d-parquet || true &&
      mc mb -p local/bench-e-warpstream || true &&
      mc anonymous set public local/bench-c-avro || true &&
      mc anonymous set public local/bench-d-parquet || true &&
      mc anonymous set public local/bench-e-warpstream || true &&
      echo 'buckets ready'"
    networks: [bench]

  # ---------- Approach E only: WarpStream agent (Kafka-API, S3-backed) ----------
  warpstream:
    image: public.ecr.aws/warpstream-labs/warpstream_agent:latest
    container_name: bench-warpstream
    hostname: warpstream
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "9192:9092"
    environment:
      AWS_ACCESS_KEY_ID: bench
      AWS_SECRET_ACCESS_KEY: benchpass
      AWS_REGION: us-east-1
    command:
      - playground
      - -kafkaPort
      - "9092"
      - -httpPort
      - "8080"
      - -bucketURL
      - "s3://bench-e-warpstream?endpoint=http://minio:9000&s3ForcePathStyle=true&region=us-east-1"
      - -advertiseHostnameStrategy
      - custom
      - -advertiseHostnameCustom
      - warpstream
    profiles: [E, all]
    networks: [bench]

  # ---------- Approach B only: Schema Registry ----------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: bench-schema-registry
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [bench]
    profiles: [B, all]

  # ---------- Driver containers (one per approach, profile-gated) ----------
  driver-A:
    <<: *driver-image
    container_name: bench-driver-A
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      MODE: kafka-json
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC: bench-A
      RPS: ${RPS:-2000}
      DURATION_S: ${DURATION_S:-300}
      WARMUP_S: ${WARMUP_S:-30}
      COMPRESSION: snappy
    command: ["python", "-u", "/app/driver.py"]
    profiles: [A, all]
    networks: [bench]

  consumer-A:
    <<: *driver-image
    container_name: bench-consumer-A
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      MODE: kafka-json
      KAFKA_BOOTSTRAP: kafka:29092
      TOPIC: bench-A
      RUN_ID: ${RUN_ID:-A}
      DURATION_S: ${DURATION_S:-300}
      WARMUP_S: ${WARMUP_S:-30}
    command: ["python", "-u", "/app/consumer.py"]
    volumes:
      - ./results:/results
    profiles: [A, all]
    networks: [bench]

  driver-B:
    <<: *driver-image
    container_name: bench-driver-B
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      MODE: kafka-avro
      KAFKA_BOOTSTRAP: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TOPIC: bench-B
      RPS: ${RPS:-2000}
      DURATION_S: ${DURATION_S:-300}
      WARMUP_S: ${WARMUP_S:-30}
      COMPRESSION: snappy
    command: ["python", "-u", "/app/driver.py"]
    profiles: [B, all]
    networks: [bench]

  consumer-B:
    <<: *driver-image
    container_name: bench-consumer-B
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      MODE: kafka-avro
      KAFKA_BOOTSTRAP: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TOPIC: bench-B
      RUN_ID: ${RUN_ID:-B}
      DURATION_S: ${DURATION_S:-300}
      WARMUP_S: ${WARMUP_S:-30}
    command: ["python", "-u", "/app/consumer.py"]
    volumes:
      - ./results:/results
    profiles: [B, all]
    networks: [bench]

  driver-C:
    <<: *driver-image
    container_name: bench-driver-C
    environment:
      MODE: file-jsonl
      LOG_DIR: /logs
      RPS: ${RPS:-2000}
      DURATION_S: ${DURATION_S:-300}
      WARMUP_S: ${WARMUP_S:-30}
    command: ["python", "-u", "/app/driver.py"]
    volumes:
      - logs-C:/logs
    profiles: [C, all]
    networks: [bench]

  sidecar-C:
    <<: *driver-image
    container_name: bench-sidecar-C
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MODE: avro
      LOG_DIR: /logs
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: bench
      MINIO_SECRET_KEY: benchpass
      MINIO_BUCKET: bench-c-avro
      ROTATE_S: ${ROTATE_S_C:-30}
      ROTATE_BYTES: ${ROTATE_BYTES_C:-16777216}
    command: ["python", "-u", "/app/sidecar.py"]
    volumes:
      - logs-C:/logs
    profiles: [C, all]
    networks: [bench]

  consumer-C:
    <<: *driver-image
    container_name: bench-consumer-C
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MODE: minio-avro
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: bench
      MINIO_SECRET_KEY: benchpass
      MINIO_BUCKET: bench-c-avro
      RUN_ID: ${RUN_ID:-C}
      DURATION_S: ${DURATION_S:-300}
      WARMUP_S: ${WARMUP_S:-30}
    command: ["python", "-u", "/app/consumer.py"]
    volumes:
      - ./results:/results
    profiles: [C, all]
    networks: [bench]

  driver-D:
    <<: *driver-image
    container_name: bench-driver-D
    environment:
      MODE: file-jsonl
      LOG_DIR: /logs
      RPS: ${RPS:-2000}
      DURATION_S: ${DURATION_S:-300}
      WARMUP_S: ${WARMUP_S:-30}
    command: ["python", "-u", "/app/driver.py"]
    volumes:
      - logs-D:/logs
    profiles: [D, all]
    networks: [bench]

  sidecar-D:
    <<: *driver-image
    container_name: bench-sidecar-D
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MODE: parquet
      LOG_DIR: /logs
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: bench
      MINIO_SECRET_KEY: benchpass
      MINIO_BUCKET: bench-d-parquet
      ROTATE_S: ${ROTATE_S_D:-60}
      ROTATE_BYTES: ${ROTATE_BYTES_D:-67108864}
    command: ["python", "-u", "/app/sidecar.py"]
    volumes:
      - logs-D:/logs
    profiles: [D, all]
    networks: [bench]

  driver-E:
    <<: *driver-image
    container_name: bench-driver-E
    depends_on:
      warpstream:
        condition: service_started
    environment:
      MODE: kafka-json
      KAFKA_BOOTSTRAP: warpstream:9092
      TOPIC: bench-E
      RPS: ${RPS:-2000}
      DURATION_S: ${DURATION_S:-300}
      WARMUP_S: ${WARMUP_S:-30}
      COMPRESSION: snappy
    command: ["python", "-u", "/app/driver.py"]
    profiles: [E, all]
    networks: [bench]

  consumer-E:
    <<: *driver-image
    container_name: bench-consumer-E
    depends_on:
      warpstream:
        condition: service_started
    environment:
      MODE: kafka-json
      KAFKA_BOOTSTRAP: warpstream:9092
      TOPIC: bench-E
      RUN_ID: ${RUN_ID:-E}
      DURATION_S: ${DURATION_S:-300}
      WARMUP_S: ${WARMUP_S:-30}
    command: ["python", "-u", "/app/consumer.py"]
    volumes:
      - ./results:/results
    profiles: [E, all]
    networks: [bench]

  consumer-D:
    <<: *driver-image
    container_name: bench-consumer-D
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MODE: minio-parquet
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: bench
      MINIO_SECRET_KEY: benchpass
      MINIO_BUCKET: bench-d-parquet
      RUN_ID: ${RUN_ID:-D}
      DURATION_S: ${DURATION_S:-300}
      WARMUP_S: ${WARMUP_S:-30}
    command: ["python", "-u", "/app/consumer.py"]
    volumes:
      - ./results:/results
    profiles: [D, all]
    networks: [bench]

volumes:
  logs-C:
  logs-D:

networks:
  bench:
    name: bench-net
