# Flink JobManager — single replica session-cluster.
#
# The JDWP agent listens on :5005 inside the pod. Use kubectl port-forward to
# attach a debugger from your IDE:
#
#   kubectl -n flink-tutorial port-forward deploy/flink-jobmanager 5005:5005
#
# Then point your IDE at localhost:5005.
#
# To make the JVM block until the debugger attaches, change suspend=n to
# suspend=y below and restart the deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: flink-tutorial
  labels: {app: flink, component: jobmanager}
spec:
  replicas: 1
  selector: {matchLabels: {app: flink, component: jobmanager}}
  template:
    metadata:
      labels: {app: flink, component: jobmanager}
    spec:
      containers:
        - name: jobmanager
          image: flink:1.18.1-scala_2.12-java11
          args: ["jobmanager"]
          env:
            - {name: JOB_MANAGER_RPC_ADDRESS, value: flink-jobmanager}
            # JDWP — server=y, suspend=n (don't block startup waiting for attach)
            - name: FLINK_ENV_JAVA_OPTS_JM
              value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
          ports:
            - {containerPort: 6123, name: rpc}
            - {containerPort: 6124, name: blob-server}
            - {containerPort: 6125, name: query}
            - {containerPort: 8081, name: webui}
            - {containerPort: 5005, name: jdwp}
          livenessProbe:
            tcpSocket: {port: 6123}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /overview, port: 8081}
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - {name: flink-config, mountPath: /opt/flink/conf}
      volumes:
        - name: flink-config
          configMap:
            name: flink-config
            items:
              - {key: flink-conf.yaml, path: flink-conf.yaml}
              - {key: log4j-console.properties, path: log4j-console.properties}
---
# Headless internal service for JM ↔ TM RPC.
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: flink-tutorial
spec:
  selector: {app: flink, component: jobmanager}
  ports:
    - {name: rpc,         port: 6123, targetPort: 6123}
    - {name: blob-server, port: 6124, targetPort: 6124}
    - {name: query,       port: 6125, targetPort: 6125}
    - {name: webui,       port: 8081, targetPort: 8081}
    - {name: jdwp,        port: 5005, targetPort: 5005}
---
# NodePort to expose the Web UI from outside the cluster (Rancher Desktop /
# Docker Desktop both forward NodePorts to localhost).
#
# Assigned: 30030 (Flink UI). Use kubectl port-forward instead if you'd
# rather not pin a NodePort:
#   kubectl -n flink-tutorial port-forward svc/flink-jobmanager 18030:8081
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager-ui
  namespace: flink-tutorial
spec:
  type: NodePort
  selector: {app: flink, component: jobmanager}
  ports:
    - {name: webui, port: 8081, targetPort: 8081, nodePort: 30030}
